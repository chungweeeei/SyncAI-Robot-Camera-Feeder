# Parameters for the syncai_camera_feeder node. All are read once at startup (read-only): the
# pipeline is built from them, so `ros2 param set` is rejected rather than silently ignored.
#
# The key is a bare /** because rclrs only matches a params-file key that is exactly "/**" or
# exactly the node's fully-qualified name, with NO wildcard expansion (see SyncAI-Robot-State's
# params file for what /**/<node> silently costs). /** is safe because this file is only ever
# passed to this one node.
/**:
  ros__parameters:
    # The udev symlink from syncai_sys_manager, not /dev/videoN (whose numbering follows probe
    # order).
    device: "/dev/syncai/camera0"
    # One resolution for the whole system. The pair must be one the sensor advertises
    # (`v4l2-ctl -d /dev/syncai/camera0 --list-formats-ext`); the AR0234 offers only 60 and 120 fps
    # at 720p, and a pair it does not offer fails as `not-negotiated` and the node exits.
    width: 1280
    height: 720
    framerate: 60
    # RTP/JPEG to the WebRTC worker; must match the worker's VIDEO_RTP_IN_PORT.
    rtp_host: "127.0.0.1"
    rtp_port: 5008
    # Further receivers of the same RTP/JPEG stream, as "host:port,host:port" (IPv4 or a name, no
    # IPv6). Another process cannot share rtp_port: udpsink sends unicast, and a second socket on
    # 5008 would take packets away from the worker instead of getting copies. With entries here the
    # branch becomes `multiudpsink`, which payloads once and sends every packet to the worker and
    # to each of them; empty keeps the plain udpsink. A receiver in another container needs host
    # networking for 127.0.0.1 to reach it. It needs the caps spelled out, since raw RTP has no SDP:
    #   udpsrc port=5010 caps="application/x-rtp,media=video,encoding-name=JPEG,payload=26,clock-rate=90000"
    #     ! rtpjitterbuffer ! rtpjpegdepay ! jpegdec ! ...
    # A bad entry is skipped with a warning; the others, and the worker, keep their stream.
    rtp_extra_clients: ""
    # Rate of image_raw/compressed. A lower positive rate drops frames on the ROS branch only, by
    # PTS, and the frames it keeps carry their own capture stamps (videorate, which did this until
    # 2026-10-16, restamped them up to a capture period early); the RTP branch stays at
    # `framerate`. 0 publishes every captured frame.
    ros_framerate: 30
    # Overridden by the launch file with <robot_id>/camera_optical_frame.
    frame_id: "camera_optical_frame"
    # Empty on the robot. On a machine without the camera, a GStreamer fragment producing
    # image/jpeg that replaces the v4l2src head (the ISP controls below are then not applied), e.g.
    #   videotestsrc is-live=true ! video/x-raw,format=YUY2,width=1280,height=720,framerate=60/1 ! jpegenc
    # Pin format=YUY2 (or I420): left to negotiate, videotestsrc picks a format whose JPEG chroma
    # sampling RTP/JPEG (RFC 2435) cannot carry, and rtpjpegpay drops every frame with
    # "Invalid component".
    source_override: ""
    # The camera's calibration, published once on camera_info at start and latched (reliable,
    # transient local; subscribe transient local to get it after the fact): the YAML
    # camera_calibration writes (ost.yaml), as it comes out. Empty publishes no
    # camera_info. The launch file sets it to the robot's own copy,
    # ~/robot_ws/config/calibration/<robot_id>/camera0.yaml, because intrinsics belong to one
    # physical camera, not to this package. A missing or malformed file, or one calibrated at
    # another resolution than width x height, publishes none, with a warning; the images go on
    # either way. It describes image_raw/compressed, which is the camera's own JPEG whether
    # stabilize is on or off; image_stabilized/compressed has no calibration.
    camera_info_file: ""

    # Sensor (ISP) controls, written through v4l2src extra-controls at capture start. The values
    # are the WebRTC worker's, measured on this camera (see its internal/config/config.go). UVC
    # control state persists in the camera firmware, so these are what every later opener sees too.
    #
    # Polarity trap: auto_exposure 0 means AUTO (UVC menu), white_balance_automatic 0 means MANUAL.
    auto_exposure: 0
    # 100 us units; only written when auto_exposure is 1.
    exposure_time: 330
    # Manual white balance at 5200 K: auto settles distinctly blue under the lab's fluorescent
    # lighting, and retunes as the frame fills with a coloured wall.
    white_balance_automatic: 0
    white_balance_temperature: 5200
    gain: 1
    brightness: 16
    # 0 = off, 1 = 50 Hz, 2 = 60 Hz. The camera ships with it off, and mains lighting then bands.
    power_line_frequency: 1

    # --- Stabilization (gyro-based EIS) ---
    # With stabilize on, the capture is rate-limited to ros_framerate, decoded, warped by the IMU
    # orientation at each frame's capture time and re-encoded (the warp on the CPU, the JPEG codec
    # as jpeg_codec below says) for the RTP branch, which then runs at ros_framerate rather than
    # framerate, and for image_stabilized/compressed. image_raw/compressed stays the camera's own
    # JPEG (at ros_framerate, with camera_info), teed off before the decoder: a warped frame is
    # rotated per frame away from the physical camera and magnified by zoom, so a consumer
    # projecting lidar points into it with camera_info and TF (the semantic mapping) would
    # misplace them. Until 2026-10-20 both branches carried the warped image. Off (the default),
    # the pipeline is the untouched MJPEG passthrough above. Leave it off until fx/fy/cx/cy and
    # imu_to_camera_rpy_deg are calibrated.
    stabilize: false
    # sensor_msgs/Imu, relative so it is <robot_id>/livox/imu: the lidar's IMU (200 Hz, hardware
    # stamped). Only rotation is used, so any IMU rigidly mounted with the camera will do.
    imu_topic: "livox/imu"
    # true: samples are placed on the timeline by header.stamp (which must be in the same time base
    # as this node's clock). false: by this node's clock when the sample arrives.
    imu_use_header_stamp: true
    # Pinhole intrinsics in pixels. 0 means the guess derived from the resolution (fx = fy =
    # width/2, about 90 deg horizontal FOV; principal point at the centre).
    #
    # The values below (fx, imu_to_camera_rpy_deg, imu_time_offset_ms, zoom) come from an offline
    # fit on the bag record/dp1f_1013_with_image (robot01, 2026-10-13): the per-frame image shift
    # against the yaw rate gives fx ~ 675 px, and a sweep of the other three minimised the
    # residual far-field shake. They are a working set, not a calibration: a checkerboard run
    # (camera_calibration on image_raw/compressed) should replace fx/fy/cx/cy, and the lens's
    # barrel distortion is not modelled at all. `tools/eis_fit.py offset` on record/dp1f_with_image
    # fits a scale of 1.08 to the gyro-predicted shift at the centre 80 % of the frame (fx ~726 px),
    # possibly the distortion (the centre magnifies more than the average): one more reason for the
    # checkerboard.
    fx: 675.0
    fy: 675.0
    cx: 0.0
    cy: 0.0
    # The TF rotation parent = IMU frame, child = camera optical frame, as roll pitch yaw in
    # degrees (tf2 / URDF convention). [-90, 0, -90] is a camera whose axes are aligned with a
    # REP-103 body-frame IMU (x forward, y left, z up). The lidar (and so its IMU) is pitched
    # 0.25 rad on base_link; the fit prefers that 14.3 deg taken back out, which in rpy is
    # [-75.7, 0, -90] (the optical axis then points 14.3 deg above the lidar's x axis).
    imu_to_camera_rpy_deg: [-75.7, 0.0, -90.0]
    # Added to each frame's capture stamp to find it on the IMU's timeline (USB latency, clock
    # offset). Half the exposure time is added automatically in manual exposure. Sweep it while
    # rocking the robot and keep the value with the least residual shake (the bag fit: +10 ms,
    # flat between +5 and +15).
    #
    # Suspect until re-swept: that bag's frames went through videorate, which stamped each one
    # 0-16.7 ms early by an amount fixed for the recording and different on every start (see
    # rate_limit.rs). The +10 ms may be mostly that recording's offset rather than a latency; with
    # the stamps now the capture's own it is probably too large. `tools/eis_fit.py offset` on
    # record/dp1f_with_image (also videorate-stamped) finds +11 ms, flat to +-1 ms and the same in
    # every 30 s window, so the true offset lies between about -6 and +11 ms. Fit it again with
    # that tool on a bag recorded after 2026-10-16 17:50.
    imu_time_offset_ms: 10.0
    # The low-pass the virtual camera follows the real one with: smoothing_order first-order
    # stages, each with time constant smoothing_time_constant_s (s). What the image shows is the
    # virtual camera's own motion, so the residual walking shake is the low-pass's gain at the
    # gait frequency, 1/sqrt(1+(2*pi*f*tau)^2) per stage (robot01's pitch, the vertical image
    # motion, is at 3.8 Hz), and a steady pan is followed order x tau behind. Replayed on
    # record/dp1f_with_image (robot01, 2026-10-16, 784 s; `tools/eis_fit.py filters`), vertical
    # gait-band (1-6 Hz) shake at the zoomed focal length, raw 6.30 px:
    #                                 pan lag  outside clamped stretches  overall  clamped
    #   1 x 0.5 s  (until 2026-10-19)  0.5 s    0.84 px (17 % of raw)      1.73 px  10.8 %
    #   2 x 0.25 s                     0.5 s    0.66 px (14 %)             1.67 px  12.3 %
    #   2 x 0.35 s                     0.7 s    0.51 px (10.5 %)           1.64 px  13.2 %
    # The overall column barely moves because while the clamp holds the view (turns use up the
    # zoom's margin) the real shake passes straight through, whatever the low-pass does. Two
    # equal stages are critically damped: the view does not overshoot and swing back when a turn
    # ends. 1 is the old single stage, for A/B comparison.
    smoothing_order: 2
    smoothing_time_constant_s: 0.35
    # Turn damping: while the robot turns, each stage's time constant is divided by
    # 1 + (excess / turn_damping_reference_rad_s)^2, excess being how far the heading rate (about
    # world z, read through two low-pass stages of turn_rate_time_constant_s so the gait's 1.9 Hz
    # heading sway averages out) is above turn_damping_deadband_rad_s. Without it a 0.5 rad/s turn
    # ran the view into the clamp, and when the turn ended the view slid the clamp's worth (5.6
    # deg) on for ~1.5 s after the robot had stopped: the image "kept flowing" (robot01,
    # 2026-10-20). The cost is the gait shake during turns, which the clamp mostly let through
    # anyway. Replayed on record/dp1f_with_image (`tools/eis_fit.py filters`; v / h are gait-band
    # vertical / horizontal shake in px at the zoomed focal length, 'slide' a synthetic 0.5 rad/s
    # turn):
    #   reference   slide    straight v / h   turning v / h   view behind in turns (median)
    #   off         5.6 deg  0.89 / 6.31      3.21 / 17.61    4.7 deg
    #   0.30        3.2      0.99 / 6.13      3.80 / 16.79    4.2
    #   0.20        1.1      1.12 / 6.45      4.71 / 16.98    3.6
    #   0.15        0.4      1.28 / 6.89      5.38 / 17.84    3.2
    #   0.10        0.0      1.55 / 7.70      6.09 / 20.41    2.4
    #   raw                  5.09 / 17.52     8.51 / 24.22
    # 0 turns it off. Lower is a view that sticks to the turn, higher one that smooths it more.
    turn_damping_reference_rad_s: 0.15
    turn_damping_deadband_rad_s: 0.1
    turn_rate_time_constant_s: 0.3
    # Output magnification, 1.0 to 2.0: the border it crops is what hides the warp. 1.3 hides
    # 7.4 degrees of pan and 5.8 of tilt at fx 675, measured at the frame's edges (the 7 degrees
    # quoted here until 2026-10-20 was the margin at the centre, which let a clamped tilt show a
    # black band); beyond that the correction is clamped, and fitted so no corner leaves the frame,
    # rather than showing black.
    zoom: 1.3
    # How long a frame waits (ms, 0 to 50) for an IMU sample newer than itself before the last
    # gyro reading is extrapolated instead.
    max_imu_wait_ms: 5.0
    # Multiplies linear_acceleration into m/s^2. Livox reports g; set 1.0 for an SI source.
    imu_accel_scale: 9.80665
    # Accelerometer correction gain of the orientation filter (Mahony kp); 0 is gyro-only. Small
    # on purpose: the warp only uses the rotation between the real and the virtual camera, so the
    # accelerometer is only there to bound slow gyro drift, and the correction low-passes its
    # apparent tilt with a corner at kp/(2*pi) Hz — which a trot's fore-aft accelerations are, at
    # the gait frequency. Replayed on record/dp1f_with_image, the accelerometer term added 2.0 px
    # RMS of vertical gait-band shake at 0.5 (the value until 2026-10-19), as much as the low-pass
    # left of the real shake, and 0.2 px at 0.05. The filter starts level with the first sample's
    # gravity, so a small gain needs no settling time.
    mahony_kp: 0.05
    # Who decodes and re-encodes the frames when stabilize is on (the passthrough decodes nothing).
    #   auto     - the Jetson's hardware JPEG (nvv4l2decoder ! nvvidconv, and nvjpegenc) when
    #              GStreamer has those elements, i.e. in a container under the nvidia runtime;
    #              jpegdec / jpegenc on the CPU otherwise (the Dev Container). The startup log says
    #              which it picked.
    #   nvidia   - the hardware chain, or a startup error naming the missing elements.
    #   software - always the CPU.
    # Measured in robot01 (AGX Orin, this camera, stabilize on at 30 fps): the node fell from ~2.5
    # to ~1.9 cores, and a frame's age when it reaches ROS from ~53 ms to ~35 ms. The image is the
    # same (both encoders run at quality 85).
    jpeg_codec: "auto"
