# Parameters for the syncai_camera_feeder node. All are read once at startup (read-only): the
# pipeline is built from them, so `ros2 param set` is rejected rather than silently ignored.
#
# The key is a bare /** because rclrs only matches a params-file key that is exactly "/**" or
# exactly the node's fully-qualified name, with NO wildcard expansion (see SyncAI-Robot-State's
# params file for what /**/<node> silently costs). /** is safe because this file is only ever
# passed to this one node.
/**:
  ros__parameters:
    # The udev symlink from syncai_sys_manager, not /dev/videoN (whose numbering follows probe
    # order).
    device: "/dev/syncai/camera0"
    # One resolution for the whole system. The pair must be one the sensor advertises
    # (`v4l2-ctl -d /dev/syncai/camera0 --list-formats-ext`); the AR0234 offers only 60 and 120 fps
    # at 720p, and a pair it does not offer fails as `not-negotiated` and the node exits.
    width: 1280
    height: 720
    framerate: 60
    # RTP/JPEG to the WebRTC worker; must match the worker's VIDEO_RTP_IN_PORT.
    rtp_host: "127.0.0.1"
    rtp_port: 5008
    # Rate of image_raw/compressed. A lower positive rate drops frames on the ROS branch only
    # (videorate drop-only); the RTP branch stays at `framerate`. 0 publishes every captured frame.
    ros_framerate: 30
    # Overridden by the launch file with <robot_id>/camera_optical_frame.
    frame_id: "camera_optical_frame"
    # Empty on the robot. On a machine without the camera, a GStreamer fragment producing
    # image/jpeg that replaces the v4l2src head (the ISP controls below are then not applied), e.g.
    #   videotestsrc is-live=true ! video/x-raw,format=YUY2,width=1280,height=720,framerate=60/1 ! jpegenc
    # Pin format=YUY2 (or I420): left to negotiate, videotestsrc picks a format whose JPEG chroma
    # sampling RTP/JPEG (RFC 2435) cannot carry, and rtpjpegpay drops every frame with
    # "Invalid component".
    source_override: ""

    # Sensor (ISP) controls, written through v4l2src extra-controls at capture start. The values
    # are the WebRTC worker's, measured on this camera (see its internal/config/config.go). UVC
    # control state persists in the camera firmware, so these are what every later opener sees too.
    #
    # Polarity trap: auto_exposure 0 means AUTO (UVC menu), white_balance_automatic 0 means MANUAL.
    auto_exposure: 0
    # 100 us units; only written when auto_exposure is 1.
    exposure_time: 330
    # Manual white balance at 5200 K: auto settles distinctly blue under the lab's fluorescent
    # lighting, and retunes as the frame fills with a coloured wall.
    white_balance_automatic: 0
    white_balance_temperature: 5200
    gain: 1
    brightness: 16
    # 0 = off, 1 = 50 Hz, 2 = 60 Hz. The camera ships with it off, and mains lighting then bands.
    power_line_frequency: 1

    # --- Stabilization (gyro-based EIS) ---
    # With stabilize on, the capture is rate-limited to ros_framerate, decoded, warped by the IMU
    # orientation at each frame's capture time and re-encoded before the tee (the warp on the CPU,
    # the JPEG codec as jpeg_codec below says): BOTH the RTP and the ROS branch carry the
    # stabilized image, and the RTP branch then runs at ros_framerate rather than framerate. Off
    # (the default), the pipeline is the untouched MJPEG passthrough above. Leave it off until
    # fx/fy/cx/cy and imu_to_camera_rpy_deg are calibrated.
    stabilize: false
    # sensor_msgs/Imu, relative so it is <robot_id>/livox/imu: the lidar's IMU (200 Hz, hardware
    # stamped). Only rotation is used, so any IMU rigidly mounted with the camera will do.
    imu_topic: "livox/imu"
    # true: samples are placed on the timeline by header.stamp (which must be in the same time base
    # as this node's clock). false: by this node's clock when the sample arrives.
    imu_use_header_stamp: true
    # Pinhole intrinsics in pixels. 0 means the guess derived from the resolution (fx = fy =
    # width/2, about 90 deg horizontal FOV; principal point at the centre).
    #
    # The values below (fx, imu_to_camera_rpy_deg, imu_time_offset_ms, zoom) come from an offline
    # fit on the bag record/dp1f_1013_with_image (robot01, 2026-10-13): the per-frame image shift
    # against the yaw rate gives fx ~ 675 px, and a sweep of the other three minimised the
    # residual far-field shake. They are a working set, not a calibration: a checkerboard run
    # (camera_calibration on image_raw/compressed) should replace fx/fy/cx/cy, and the lens's
    # barrel distortion is not modelled at all.
    fx: 675.0
    fy: 675.0
    cx: 0.0
    cy: 0.0
    # The TF rotation parent = IMU frame, child = camera optical frame, as roll pitch yaw in
    # degrees (tf2 / URDF convention). [-90, 0, -90] is a camera whose axes are aligned with a
    # REP-103 body-frame IMU (x forward, y left, z up). The lidar (and so its IMU) is pitched
    # 0.25 rad on base_link; the fit prefers that 14.3 deg taken back out, which in rpy is
    # [-75.7, 0, -90] (the optical axis then points 14.3 deg above the lidar's x axis).
    imu_to_camera_rpy_deg: [-75.7, 0.0, -90.0]
    # Added to each frame's capture stamp to find it on the IMU's timeline (USB latency, clock
    # offset). Half the exposure time is added automatically in manual exposure. Sweep it while
    # rocking the robot and keep the value with the least residual shake (the bag fit: +10 ms,
    # flat between +5 and +15).
    imu_time_offset_ms: 10.0
    # Time constant (s) of the low-pass the virtual camera follows the real one with. Larger is
    # steadier and lags further behind real pans.
    smoothing_time_constant_s: 0.5
    # Output magnification, 1.0 to 2.0: the border it crops is what hides the warp. 1.3 hides
    # about 7 degrees of correction at fx 675 (1.15 hid only 4, which the robot's 0.5 rad/s turns
    # exhausted); beyond that the correction is clamped rather than showing black.
    zoom: 1.3
    # How long a frame waits (ms, 0 to 50) for an IMU sample newer than itself before the last
    # gyro reading is extrapolated instead.
    max_imu_wait_ms: 5.0
    # Multiplies linear_acceleration into m/s^2. Livox reports g; set 1.0 for an SI source.
    imu_accel_scale: 9.80665
    # Accelerometer correction gain of the orientation filter (Mahony kp); 0 is gyro-only.
    mahony_kp: 0.5
    # Who decodes and re-encodes the frames when stabilize is on (the passthrough decodes nothing).
    #   auto     - the Jetson's hardware JPEG (nvv4l2decoder ! nvvidconv, and nvjpegenc) when
    #              GStreamer has those elements, i.e. in a container under the nvidia runtime;
    #              jpegdec / jpegenc on the CPU otherwise (the Dev Container). The startup log says
    #              which it picked.
    #   nvidia   - the hardware chain, or a startup error naming the missing elements.
    #   software - always the CPU.
    # Measured in robot01 (AGX Orin, this camera, stabilize on at 30 fps): the node fell from ~2.5
    # to ~1.9 cores, and a frame's age when it reaches ROS from ~53 ms to ~35 ms. The image is the
    # same (both encoders run at quality 85).
    jpeg_codec: "auto"
