[package]
name = "syncai_camera_feeder"
version = "0.1.0"
edition = "2024"
# Matches the Dev Container toolchain and clippy.toml's msrv. Declared, not just implied, because
# the Dockerfile's CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback resolves against it: without
# a rust-version the first resolve picked uuid / kstring releases that need rustc 1.89 / 1.96.
rust-version = "1.85"

[[bin]]                         # one [[bin]] per node; this is the name `ros2 run` uses
name = "camera_feeder_node"
path = "src/main.rs"

[dependencies]
rclrs = "0.8"
# Pinned to 0.2 to match syncai_robot_state / syncai_driver_manager; rclrs uses 0.3 internally and
# the two crates' message types are NOT interchangeable, so never pass a type from one to an API of
# the other.
ros-env = "0.2"
# v1_20 and nothing newer: the robot container is Ubuntu 22.04 with GStreamer 1.20.3, and a
# feature above it would compile here and then fail to resolve symbols at load time on the robot
# (the same trap the WebRTC worker's go-gst pin documents).
gstreamer = { version = "0.24", features = ["v1_20"] }
gstreamer-app = { version = "0.24", features = ["v1_20"] }

# Install launch/ and params/ into share/syncai_camera_feeder/ so the launch file finds them
[package.metadata.ros]
install_to_share = ["launch", "params"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
